name: Internal test bundle
# Release 1.1.5: atomic reminder editing and reliable weekday selection.
on:
  workflow_dispatch:
  push:
    branches: [main, feat/monogram-startup, fix/reminder-weekdays-1.1.5]
    paths: ['.github/workflows/internal-test-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-aab]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate source
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintRelease
      - name: Check configured signing
        id: signing
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.KEGEL_UPLOAD_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEGEL_UPLOAD_STORE_PASSWORD }}
          UPLOAD_ALIAS: ${{ secrets.KEGEL_UPLOAD_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEGEL_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEY_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$UPLOAD_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare upload key
        if: steps.signing.outputs.available == 'true'
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.KEGEL_UPLOAD_KEY_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY_BASE64"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'upload.jks'
          path.write_bytes(base64.b64decode(os.environ['UPLOAD_KEY_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Build AAB for local signing
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew :app:bundleRelease :app:assembleRelease --info
      - name: Build signed AAB
        if: steps.signing.outputs.available == 'true'
        env:
          KEGEL_UPLOAD_STORE: ${{ runner.temp }}/upload.jks
          KEGEL_UPLOAD_STORE_PASSWORD: ${{ secrets.KEGEL_UPLOAD_STORE_PASSWORD }}
          KEGEL_UPLOAD_ALIAS: ${{ secrets.KEGEL_UPLOAD_ALIAS }}
          KEGEL_UPLOAD_KEY_PASSWORD: ${{ secrets.KEGEL_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --info
          sha256sum app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Prepare optimized APK for smoke test
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -dname 'CN=Smoke' -keyalg RSA -validity 2
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --out "$RUNNER_TEMP/smoke.apk" "$APK"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test optimized release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install "$RUNNER_TEMP/smoke.apk"
            python3 tools/release_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: kegel-coach-internal-test-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/*.zip
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'upload.jks').unlink(missing_ok=True)
          PY

